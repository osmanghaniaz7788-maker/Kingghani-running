<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>King Ghani Runner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#fff4e0;--gold:#ffc94a;--hot:#ff5a3c;--night:#2a1244}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--night);overflow:hidden;font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:700;font-size:20px}
#hud span{background:rgba(42,18,68,.6);padding:4px 12px;border-radius:12px}
#hud b{color:var(--gold)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:rgba(32,10,52,.78)}
.screen.hide{display:none}
.avatar{width:clamp(130px,34vw,200px);height:clamp(130px,34vw,200px);border-radius:50%;border:4px solid var(--gold);object-fit:cover;box-shadow:0 0 0 4px var(--hot)}
#profile{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:12px;display:flex;align-items:center;gap:8px;pointer-events:none;background:rgba(42,18,68,.6);padding:4px 12px 4px 4px;border-radius:30px;font-weight:700;font-size:16px}
#profile img{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
#splash{z-index:5;background:radial-gradient(circle at 50% 40%,#8c2f5e,#2a1244 70%);transition:opacity .6s}
#splash.fade{opacity:0;pointer-events:none}
#splash .avatar{animation:pop .7s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){#splash .avatar{animation:none}}
h1{margin:0;font-size:clamp(34px,9vw,60px);line-height:1.3;color:var(--gold)}
p{margin:0;max-width:30em;font-size:clamp(16px,4.2vw,20px);line-height:1.9}
button{font:inherit;font-weight:700;font-size:22px;padding:12px 38px;border:0;border-radius:14px;background:var(--hot);color:#fff;cursor:pointer;margin-top:6px}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button:active{transform:scale(.97)}
#final{font-size:26px;color:var(--gold);font-weight:700}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span>ټکي: <b id="sc">0</b></span><span>سکې: <b id="co">0</b></span><span>ریکارډ: <b id="hi">0</b></span></div>

<div class="screen" id="start">
  <h1 dir="ltr">King Ghani Runner</h1>
  <p>کیڼ یا ښي ته سوایپ کړئ چې لین بدل شي.<br>پورته سوایپ = ټوپ، ښکته سوایپ = ښکته کېدل.<br>په کمپیوټر کې: غشي کیلي یا WASD.</p>
  <button id="go">لوبه پیل کړئ</button>
</div>
<div class="screen hide" id="over">
  <h1>ټکر وشو!</h1>
  <div id="final"></div>
  <button id="again">بیا لوبه</button>
</div>

<script>
(function(){
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
$('pimg').src=$('face').src;
const sp=$('splash');let spDone=false;
function closeSplash(){if(spDone)return;spDone=true;sp.classList.add('fade');setTimeout(()=>sp.classList.add('hide'),650)}
sp.addEventListener('click',closeSplash);setTimeout(closeSplash,2600);
let W,H,dpr,laneW,U,horizonY,baseY,cx;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  laneW=Math.min(W*0.3,H*0.3);U=laneW*0.55;
  horizonY=H*0.38;baseY=H*0.84;cx=W/2;
}
window.addEventListener('resize',resize);resize();

let best=0;
try{best=parseInt(localStorage.getItem('runner-best'))||0}catch(e){}
$('hi').textContent=best;

let state='idle',objs,dist,speed,score,coins,px,lane,jy,vy,slide,spawnLeft,t,shake;

function reset(){
  objs=[];dist=0;speed=16;score=0;coins=0;px=0;lane=0;jy=0;vy=0;slide=0;spawnLeft=30;t=0;shake=0;
  $('sc').textContent=0;$('co').textContent=0;
}
reset();

function start(){
  reset();state='play';
  $('start').classList.add('hide');$('over').classList.add('hide');
}
function die(){
  state='dead';shake=0.4;
  const s=Math.floor(score);
  if(s>best){best=s;try{localStorage.setItem('runner-best',best)}catch(e){}}
  $('hi').textContent=best;
  $('final').textContent='ستاسو ټکي: '+s+' — سکې: '+coins;
  setTimeout(()=>$('over').classList.remove('hide'),450);
}
$('go').onclick=start;$('again').onclick=start;

function moveLane(d){if(state!=='play')return;lane=Math.max(-1,Math.min(1,lane+d))}
function jump(){if(state==='play'&&jy<=0.01){vy=9.5;slide=0}}
function duck(){if(state==='play'){slide=0.7;if(jy>0)vy=-14}}

window.addEventListener('keydown',e=>{
  const k=e.key;
  if(state!=='play'){if(k==='Enter'||k===' '){if(!(e.target&&e.target.tagName==='BUTTON')){start();e.preventDefault()}}return}
  if(k==='ArrowLeft'||k==='a'||k==='A')moveLane(-1);
  else if(k==='ArrowRight'||k==='d'||k==='D')moveLane(1);
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')jump();
  else if(k==='ArrowDown'||k==='s'||k==='S')duck();
  if(k.startsWith('Arrow')||k===' ')e.preventDefault();
});

let sx=0,sy=0,sid=null;
cv.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;sid=e.pointerId});
cv.addEventListener('pointerup',e=>{
  if(sid!==e.pointerId)return;sid=null;
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24){jump();return}
  if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);
  else if(dy<0)jump();else duck();
});

function spawn(){
  const D=80;
  const r=Math.random();
  if(r<0.3){
    const l=Math.floor(Math.random()*3)-1;
    for(let i=0;i<6;i++)objs.push({k:'coin',lane:l,d:D+i*2.6,hi:i%2&&Math.random()<0.4});
  }else if(r<0.55){
    objs.push({k:'crate',lane:Math.floor(Math.random()*3)-1,d:D});
  }else if(r<0.8){
    objs.push({k:'bar',lane:Math.floor(Math.random()*3)-1,d:D});
  }else{
    const a=Math.floor(Math.random()*3)-1;
    objs.push({k:'wall',lane:a,d:D});
    if(Math.random()<0.5){let b=a;while(b===a)b=Math.floor(Math.random()*3)-1;objs.push({k:'wall',lane:b,d:D})}
  }
  spawnLeft=Math.max(11,22-speed*0.28)+Math.random()*8;
}

function update(dt){
  t+=dt;
  if(state==='play'){
    speed=Math.min(40,16+dist/160);
    const step=speed*dt;dist+=step;score+=step*0.1;
    spawnLeft-=step;if(spawnLeft<=0)spawn();
    px+=(lane-px)*Math.min(1,dt*14);
    if(jy>0||vy>0){vy-=26*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0}}
    if(slide>0)slide-=dt;
    for(const o of objs){
      o.d-=step;
      if(o.dead||Math.abs(o.d)>0.7||Math.abs(o.lane-px)>0.6)continue;
      if(o.k==='coin'){o.dead=true;coins++;score+=5;$('co').textContent=coins}
      else if(o.k==='crate'){if(jy<0.75){die();break}}
      else if(o.k==='bar'){if(slide<=0){die();break}}
      else{die();break}
    }
    objs=objs.filter(o=>!o.dead&&o.d>-1.6);
    $('sc').textContent=Math.floor(score);
  }else if(state==='idle'){
    dist+=12*dt;
  }
  if(shake>0)shake-=dt;
}

const sc=d=>1/(1+Math.max(d,-1.2)/10);
const gy=s=>horizonY+(baseY-horizonY)*s;
const lx=(l,s)=>cx+l*laneW*s;

function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,horizonY);
  g.addColorStop(0,'#2a1244');g.addColorStop(0.55,'#8c2f5e');g.addColorStop(1,'#ff8a4c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,horizonY+1);
  ctx.fillStyle='#ffd27a';ctx.beginPath();ctx.arc(cx,horizonY-laneW*0.05,laneW*0.55,Math.PI,0);ctx.fill();
  ctx.fillStyle='#4a1d5c';
  ctx.beginPath();ctx.moveTo(0,horizonY);
  for(let x=0;x<=W;x+=W/10){ctx.lineTo(x,horizonY-(18+((Math.sin(x*0.013)+1)*22)))}
  ctx.lineTo(W,horizonY);ctx.closePath();ctx.fill();
  ctx.fillStyle='#d98b45';ctx.fillRect(0,horizonY,W,H-horizonY);
}
function drawRoad(){
  const half=1.7*laneW;
  ctx.fillStyle='#3b2a3f';
  ctx.beginPath();ctx.moveTo(cx,horizonY);ctx.lineTo(cx+half*1.0,baseY+(H-baseY)*0.0+ (baseY-horizonY)*0.0);
  // extend road to bottom of screen
  const sb=(H-horizonY)/(baseY-horizonY);
  ctx.lineTo(cx+half*sb,H);ctx.lineTo(cx-half*sb,H);ctx.lineTo(cx-half*1.0,baseY);ctx.closePath();ctx.fill();
  // lane dashes
  const period=6,off=dist%period;
  ctx.fillStyle='#ffe9b8';
  for(const b of[-0.5,0.5]){
    for(let k=-1;k<14;k++){
      const d0=k*period-off,d1=d0+period*0.45;
      if(d1<-1.2)continue;
      const s0=sc(d0),s1=sc(d1);
      const w0=laneW*0.035*s0,w1=laneW*0.035*s1;
      ctx.beginPath();
      ctx.moveTo(lx(b,s0)-w0,gy(s0));ctx.lineTo(lx(b,s0)+w0,gy(s0));
      ctx.lineTo(lx(b,s1)+w1,gy(s1));ctx.lineTo(lx(b,s1)-w1,gy(s1));ctx.closePath();ctx.fill();
    }
  }
  // road edges
  ctx.strokeStyle='#ff5a3c';ctx.lineWidth=Math.max(2,laneW*0.04);
  for(const sgn of[-1,1]){
    ctx.beginPath();ctx.moveTo(cx,horizonY);ctx.lineTo(cx+sgn*half*sb,H);ctx.stroke();
  }
}
function drawCactus(x,y,h,s){
  ctx.fillStyle='#2f7a4a';
  const w=h*0.22;
  rr(x-w/2,y-h,w,h,w/2);
  rr(x-w*1.5,y-h*0.65,w*0.8,h*0.12,w*0.2);rr(x-w*1.5,y-h*0.8,w*0.45,h*0.3,w*0.2);
  rr(x+w*0.7,y-h*0.55,w*0.8,h*0.12,w*0.2);rr(x+w*1.05,y-h*0.72,w*0.45,h*0.3,w*0.2);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);ctx.fill()}

function drawObj(o){
  const s=sc(o.d),y=gy(s),x=lx(o.lane,s),u=U*s;
  if(o.k==='coin'){
    const cy=y-u*(o.hi?1.5:0.7),r=u*0.28,sq=Math.abs(Math.cos(t*4+o.d));
    ctx.fillStyle='#ffc94a';ctx.beginPath();ctx.ellipse(x,cy,Math.max(r*sq,r*0.2),r,0,0,7);ctx.fill();
    ctx.strokeStyle='#b8801a';ctx.lineWidth=Math.max(1,u*0.04);ctx.stroke();
  }else if(o.k==='crate'){
    ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,u*0.55,u*0.14,0,0,7);ctx.fill();
    ctx.fillStyle='#c9772e';ctx.fillRect(x-u*0.45,y-u*0.62,u*0.9,u*0.62);
    ctx.strokeStyle='#5c3213';ctx.lineWidth=Math.max(1.5,u*0.07);
    ctx.strokeRect(x-u*0.45,y-u*0.62,u*0.9,u*0.62);
    ctx.beginPath();ctx.moveTo(x-u*0.45,y-u*0.62);ctx.lineTo(x+u*0.45,y);ctx.moveTo(x+u*0.45,y-u*0.62);ctx.lineTo(x-u*0.45,y);ctx.stroke();
  }else if(o.k==='bar'){
    ctx.fillStyle='#e8e0d0';
    ctx.fillRect(x-u*0.6,y-u*1.15,u*0.12,u*1.15);ctx.fillRect(x+u*0.48,y-u*1.15,u*0.12,u*1.15);
    ctx.fillStyle='#ff5a3c';ctx.fillRect(x-u*0.65,y-u*1.3,u*1.3,u*0.4);
    ctx.fillStyle='#fff4e0';
    for(let i=0;i<4;i++)ctx.fillRect(x-u*0.65+i*u*0.325+u*0.08,y-u*1.3,u*0.14,u*0.4);
  }else{
    ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x,y,u*0.6,u*0.15,0,0,7);ctx.fill();
    ctx.fillStyle='#8f2438';ctx.fillRect(x-u*0.5,y-u*1.9,u,u*1.9);
    ctx.fillStyle='#c2354f';ctx.fillRect(x-u*0.5,y-u*1.9,u,u*0.25);
    ctx.fillStyle='#6d1527';
    for(let i=1;i<5;i++)ctx.fillRect(x-u*0.5,y-u*1.9+i*u*0.38,u,u*0.05);
  }
}

function drawPlayer(){
  const s=1,x=lx(px,s),foot=baseY-jy*U*0.7;
  const dead=state==='dead';
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath();ctx.ellipse(x,baseY,U*0.4/(1+jy*0.6),U*0.1,0,0,7);ctx.fill();
  const sl=slide>0&&jy<=0.01;
  const ph=t*15,run=state==='play'&&jy<=0.01?1:0;
  const bodyH=sl?U*0.5:U*0.75,legH=sl?U*0.2:U*0.55;
  const hipY=foot-legH,topY=hipY-bodyH;
  ctx.lineCap='round';
  // legs
  ctx.strokeStyle='#1c2a5a';ctx.lineWidth=U*0.17;
  for(const sg of[-1,1]){
    const sw=run?Math.sin(ph+(sg>0?Math.PI:0)):(jy>0?sg*0.6:0);
    ctx.beginPath();ctx.moveTo(x+sg*U*0.1,hipY);
    ctx.lineTo(x+sg*U*0.1+sw*U*0.3,foot-Math.max(0,-sw)*U*0.18);ctx.stroke();
  }
  // body
  ctx.fillStyle='#ff5a3c';rr(x-U*0.25,topY,U*0.5,bodyH,U*0.15);
  // arms
  ctx.strokeStyle='#ff5a3c';ctx.lineWidth=U*0.13;
  for(const sg of[-1,1]){
    const sw=run?Math.sin(ph+(sg>0?0:Math.PI)):(jy>0?-1:0);
    ctx.beginPath();ctx.moveTo(x+sg*U*0.24,topY+bodyH*0.2);
    ctx.lineTo(x+sg*U*0.34+sw*U*0.05,topY+bodyH*0.2+U*0.3+sw*U*0.12);ctx.stroke();
  }
  // head
  const hy=topY-U*0.2+(sl?U*0.12:0);
  ctx.fillStyle='#f2c29b';ctx.beginPath();ctx.arc(x,hy,U*0.22,0,7);ctx.fill();
  ctx.fillStyle='#2a1244';ctx.beginPath();ctx.arc(x,hy-U*0.05,U*0.23,Math.PI,0);ctx.fill();
  ctx.fillRect(x-U*0.04,hy-U*0.02,U*0.3,U*0.05);
  ctx.fillStyle='#2a1244';ctx.beginPath();ctx.arc(x+U*0.09,hy+U*0.02,U*0.03,0,7);ctx.fill();
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
  drawBackground();drawRoad();
  // scenery + objects far to near
  const items=[];
  const per=9,off=dist%per;
  for(let k=0;k<10;k++){const d=k*per-off;items.push({sc:1,d,side:-1});items.push({sc:1,d:d+4,side:1})}
  for(const o of objs)items.push(o);
  items.sort((a,b)=>b.d-a.d);
  let drawn=false;
  for(const it of items){
    if(!drawn&&it.d<0){drawPlayer();drawn=true}
    if(it.side){const s=sc(it.d);if(it.d>-1.2)drawCactus(cx+it.side*laneW*2.35*s,gy(s),U*1.6*s,s)}
    else drawObj(it);
  }
  if(!drawn)drawPlayer();
  ctx.restore();
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  update(dt);draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
